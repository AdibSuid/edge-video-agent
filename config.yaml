cloud_password: tapwaysuperadmin
cloud_upload_enabled: true
cloud_upload_url: http://101.47.153.138:8081
cloud_username: tapway
encoding_crf: 28
encoding_preset: ultrafast

# Tapway-style Motion Detection Settings (Global defaults)
motion_blur_kernel: 5
motion_cooldown: 3
motion_detection_scale: 0.25
motion_frame_skip: 2
motion_high_fps: 25
motion_low_fps: 1
motion_min_area: 5000
motion_sensitivity: 100
motion_zones: []

# Tapway-style Recording Features
pre_record_buffer: 0       # Seconds to record before motion (0-5, requires buffering)
zone_mode: "all"           # "all" = apply zones to all cameras, "individual" = per-camera zones
streams:
- chunk_duration: 8
  chunk_fps: 2
  chunking_enabled: true
  enabled: true
  id: Pantry
  name: Camera 192.168.0.14
  rtsp_url: rtsp://admin:tapway123@192.168.0.14:554/cam/realmonitor?channel=1&subtype=0
  streaming_enabled: true
  # Per-camera motion settings (Tapway-style)
  motion_sensitivity: 100      # Override global sensitivity (0-255)
  motion_zones: []             # Per-camera zones (if zone_mode is "individual")
  pre_record_buffer: 0        # Per-camera pre-record buffer
- chunk_duration: 8
  chunk_fps: 2
  chunking_enabled: true
  enabled: true
  id: OfficeWindow
  name: Camera 192.168.0.130
  rtsp_url: rtsp://admin:tapway123@192.168.0.130:554/cam/realmonitor?channel=1&subtype=0
  streaming_enabled: true
  motion_sensitivity: 100
  motion_zones: []
  pre_record_buffer: 0
- chunk_duration: 8
  chunk_fps: 2
  chunking_enabled: true
  enabled: true
  id: OfficeEntrance
  name: Camera 192.168.0.198
  rtsp_url: rtsp://admin:tapway123@192.168.0.198:554/cam/realmonitor?channel=1&subtype=0
  streaming_enabled: true
  motion_sensitivity: 100
  motion_zones: []
  pre_record_buffer: 0
use_hardware_decode: true
use_hardware_encode: true

# Hardware pipeline settings
use_hardware_pipeline: true  # Enable pure GStreamer hardware pipeline
chunk_bitrate: 2000000       # 2 Mbps